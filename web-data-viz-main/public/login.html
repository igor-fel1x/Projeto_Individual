<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="navbar">
        <a href="./index.html">
        <img src="assets/imgs/Design_sem_nome__1_-removebg-preview.png" alt="">
        </a>
    </div>

    <div class="geral">
        <div class="boxCadastro">
            <div class="geralInput">
                <div class="inputsBox1">
                    <div class="titulo">
                        <h4>Login</h4>
                    </div>

                    <input type="text" id="input_email" placeholder="Email"> <br>
                    <input type="password" id="input_senha" placeholder="Senha"> <br>
                    
                    <div class="botao">
                        <button onclick="entrar()">Entrar</button>
                    </div>

                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>

                    <div id="div_aguardar" class="loading-div">
                        <!-- <img src="./assets/circle-loading.gif" height="100px" id="loading-gif"> -->
                    </div>
                </div>
            </div>
            
            <div class="geral2">
                <div class="txt1">
                    <a>Faça seu login e entre no mundo das artes marciais!</a>
                </div>
                <div class="img-box">
                    <video height="180px" width="300px" autoplay loop muted playsinline class="video1" id="video1">
                        <source src="assets/imgs/spider.mp4" type="video/mp4">
                        Seu navegador não suporta a tag de vídeo.
                    </video>
                </div>
            </div>
        </div>
    </div>

    <script src="js/sessao.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
