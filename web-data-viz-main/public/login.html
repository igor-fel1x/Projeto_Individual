<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/login.css">
    <script src="./js/sessao.js"></script>
</head>

<body>

    <div class=" navbar">
        <img src="assets/imgs/Design_sem_nome__1_-removebg-preview.png" alt="">
    </div>


<div class="geral">
    <div class="boxCadastro">
        <div class=" geralInput">
            <div class="inputsBox1">
                <div class="titulo">
                <h4> Login</h4>
                 </div>

                <input type="text" id="input_email" placeholder="Email"> <br>

                <input type="text" id="input_senha" placeholder="Senha"> <br>

                <div class="botao">
                    <button onclick="entrar()">Enviar Dados</button>
                </div>
            
            </div>
       </div>
       <div class="geral2">
        <div class="txt1">
            <a> <br>Faça seu login!</a>
       </div>
        <div class="img-box">
           <video width="300px" autoplay loop muted playsinline>
    <source src="assets/imgs/charles.mp4" type="video/mp4">
    Seu navegador não suporta a tag de vídeo.
</video>
 <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>
                <div class="card_erro" id="cardErro">
                    <div id="div_erros_login"></div>
                <span id="mensagem_erro"></span>
            </div>
        </div>
        </div>
    </div>

    </div>
</body>
</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = input_email.value;
        var senhaVar = input_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
