<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="css/jogo.css">
</head>

<body>
    <div class="navbar">
        <img src="assets/imgs/Design_sem_nome__1_-removebg-preview.png" alt="">
    </div>

    <body onload="obterDados()"></body> <!-- Chamando a função obterDados ao carregar a página -->

    <div class="janela" id="janela">
        <div class="header-left dash-header">
            <h1>Igao</h1>
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
            <div class="btn-nav">
                <a href="../jogo.html">
                    <h3>Jogar</h3>
                </a>
            </div>
            <div class="btn-nav-white">
                <a href="./dashboard/dashboard.html">
                    <h3>Resultados</h3>
                </a>
            </div>
            <div class="btn-logout">
                <a href="../index.html">
                    <h3>Sair</h3>
                </a>
            </div>
        </div>
    </div>

    <div class="geral" id="geral" onclick="aumentarforca()">
        <div class="conteudo-geral">
            <div class="contadorForca" id="contadorForca">Tempo: 6s</div>

            <div class="alvo" id="alvo">
                <div class="alvo2">
                    <img id="img_alvo" src="assets/imgs/alvo.png" alt="">
                </div>
            </div>

            <div class="luva" id="luva">
                <img id="img_luva" src="assets/imgs/imgluva.png" alt="" onclick="aumentarforca()">
            </div>

            <div class="barra" id="barra">
                <div class="barraForca" id="barraForca"></div>
            </div>
        </div>
    </div>

    <!-- Tela de Resultado Final -->
    <div class="tela-resultado" id="telaResultado">
        <div class="resultado-conteudo">
            <h2>Resultado Final </h2>
            <div class="forca-valor" id="forcaValor">0</div>
            <p>pontos de força</p>
            
        </div>
    </div>

    <script src="js/jogo.js"></script>
</body>

</html>
