<script>
  
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  
 function buscarDadosGrafico() {
    var ctx = document.getElementById('barra').getContext('2d');
    var idUsuario = sessionStorage.getItem("ID_USUARIO")

    fetch(`/forca/buscarDadosGrafico/${idUsuario}`)
            .then(function(resposta) {
            return resposta.json(); // Converte a resposta para JSON
        })

        .then(function(resposta) {
            var forcas = [];
            var tentativas = [];

            // Se vierem dados do banco
            for(var i = 0; i < resposta.length; i++){
                forcas.push(resposta[i].forca);          // Valores do eixo Y
                tentativas.push((i + 1)); // Rótulos do eixo X
            }
            if (resposta.length === 0) {
                forcas = [0];
                tentativas = ['Sem dados'];
            }
  
  // Criando o gráfico de barra usando o Chart.js
  var myChart = new Chart(ctx, {
      type: 'bar', // Tipo de gráfico: barra
      data: { // Dados para o gráfico
          labels: tentativas, // Rótulos no eixo X
          datasets: [{
              label: 'Força (N)', // Nome do conjunto de dados
              data: forcas, // Dados dos votos
              backgroundColor: [
                  ' rgb(175, 19, 19)', // Cor de fundo das barras
              ],
              borderColor: [
                  'rgb( 0, 0, 0)', // Cor da borda das barras
              ],
              borderWidth: 2 // Largura da borda das barras
          }]
      },
         options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            suggestedMin: 0,    // Valor mínimo
                            suggestedMax: 1000, // Valor máximo
                            ticks: {
                                stepSize: 100   // Intervalo de 100 em 100
                            },
                            title: {
                                display: true,
                                text: 'Força (N)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Tentativas'
                            },
                            ticks: {
                                callback: function(value) {
                                    return value; // Mostra só o número
                                }
                            }
                        }
                    }
                }
            });
    })  .catch(function(erro) {
                console.log('Erro ao carregar gráfico:', erro);      
            });
  }


  // Capturando o elemento canvas pelo id 
 

function consultarDadosMaxForca(){
  var idUsuario = sessionStorage.getItem("ID_USUARIO")
  fetch('/forca/maxforca', {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: 
    JSON.stringify({
      idUsuarioServer: idUsuario
    })
  })
  .then(function (resposta){
    resposta.json()
    .then(function (respostaConversao){
      maiorForca.innerHTML = `
      ${respostaConversao[0].maior_forca}
      `
      mediaForca.innerHTML = `
      ${respostaConversao[0].media_forca}
      `
      qtdTentativa.innerHTML = `
      ${respostaConversao[0].qtd_tentativas}
      `
      menorForca.innerHTML = `
      ${respostaConversao[0].menor_forca}

      `
    }).catch(function (erroConversao){
      console.log(erroConversao)
    })
  }).catch(function (erro){
    console.log(erro)
  })
}
window.onload = 
consultarDadosMaxForca()
buscarDadosGrafico()

</script>
